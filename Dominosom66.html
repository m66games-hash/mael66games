.panel{background:var(--panel);border:1px solid #2e7139;border-radius:20px;padding:16px;margin:10px 0;box-shadow:0 0 22px #001b08}
h1,h2,h3{margin:0 0 10px}h2{font-size:24px}
.btn{width:100%;border:2px solid var(--g);background:#071008;color:var(--g);padding:13px;border-radius:14px;margin:5px 0;font-weight:900}.primary{background:var(--g);color:#031004}.gold{border-color:var(--y);color:var(--y)}.red{border-color:#ff4d45;color:#ff6b64}
.row{display:flex;gap:7px}.row>*{flex:1}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #315b37;background:#061008;color:#fff;outline:none}label{display:block;font-size:12px;color:#a7cba9;font-weight:bold;margin:9px 0 4px}
.avatar{width:94px;height:94px;object-fit:cover;border-radius:50%;display:block;margin:0 auto 10px;border:3px solid var(--g);background:#071008}
.small{font-size:12px;color:#a7bca9}.code{font-size:35px;text-align:center;color:var(--y);font-weight:1000;letter-spacing:7px;padding:6px}
.players{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pl{display:flex;align-items:center;gap:8px;padding:9px;border:1px solid var(--line);border-radius:13px;background:#071008}.pl img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid #315d37}.on{color:var(--g);font-size:11px;font-weight:bold}
.status{padding:9px;border-radius:11px;background:#081509;color:#cfe8d1;font-size:12px;margin:8px 0}
.table{border:4px solid #101610;border-radius:23px;background:radial-gradient(circle,#164b20,#07190b 65%,#020402);box-shadow:inset 0 0 35px #000,0 0 20px #063b12;padding:10px;min-height:420px;display:flex;flex-direction:column;justify-content:space-between}
.seats{display:flex;justify-content:space-around;gap:4px}.seat{text-align:center;font-size:11px;min-width:60px}.seat img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid #315d37}.seat.active img{border-color:var(--g);box-shadow:0 0 12px var(--g)}
.board{min-height:110px;display:flex;align-items:center;justify-content:center;gap:3px;flex-wrap:wrap;padding:5px}.ends{text-align:center;color:var(--y);font-weight:900;font-size:13px;min-height:20px}
.domino{width:48px;height:76px;background:#f4f0d7;color:#111;border:2px solid #111;border-radius:7px;display:flex;flex-direction:column;box-shadow:0 3px 8px #000}.half{height:50%;display:flex;align-items:center;justify-content:center}.half:first-child{border-bottom:1px solid #777}.pips{display:grid;grid-template-columns:repeat(3,6px);grid-template-rows:repeat(3,6px);gap:3px}.pip{width:6px;height:6px;background:#111;border-radius:50%}
.handwrap{background:#0006;padding:8px;border-radius:14px;margin-top:8px}.hand{display:flex;gap:7px;overflow-x:auto;padding:5px 2px 8px}.hand .domino{width:45px;height:71px;flex:none;cursor:grab;touch-action:none;user-select:none}.hand .domino:active{transform:translateY(-4px)}.dragTile{touch-action:none;user-select:none}.dragTile.dragging{opacity:.35}.dropzones{display:flex;gap:6px;align-items:stretch;justify-content:space-between;margin:7px 0}.dropzone{flex:1;min-height:54px;border:2px dashed #285c30;border-radius:10px;color:#6fae77;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;text-align:center;background:#031006;transition:.15s}.dropzone.active{border-color:var(--g);color:#fff;background:#0a2810;transform:scale(1.02)}.dropzone.center{flex:1.2}.dragghost{position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-50%) rotate(3deg);filter:drop-shadow(0 8px 12px #000)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.chat{height:155px;overflow:auto;background:#020502;border-radius:12px;padding:8px}.msg{background:#102015;border-radius:10px;padding:7px;margin:5px 0;font-size:13px}.msg b{color:var(--g)}.msg.me{text-align:right;background:#17371b}.chatbar{display:flex;gap:6px;margin-top:6px}.chatbar input{min-width:0}.micbtn{width:50px!important}
.modal{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}.modal.hidden{display:none}.modalbox{max-width:560px;width:100%;max-height:92vh;overflow:auto;background:#071008;border:2px solid var(--g);border-radius:20px;padding:17px}
.audioBox{position:fixed;left:-9999px;top:-9999px}.secureBadge{position:fixed;top:8px;right:8px;z-index:40;padding:6px 9px;border-radius:10px;font-size:10px;background:#081509;border:1px solid #315d37;color:#b9d8bc}.secureBadge.ok{border-color:var(--g);color:var(--g)}.secureBadge.bad{border-color:#ff5c5c;color:#ff8b8b}.winnerBanner{margin:10px 0;padding:16px;border:2px solid var(--y);border-radius:16px;background:linear-gradient(135deg,#211b00,#071008);text-align:center;box-shadow:0 0 22px #ffe60033}.winnerBanner .big{font-size:25px;color:var(--y);font-weight:1000}.winnerBanner .pts{margin-top:5px;color:#fff;font-weight:800}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#030603;border:1px solid var(--g);padding:11px 15px;border-radius:13px;z-index:100;max-width:92%;text-align:center}
@media(max-width:390px){.domino{width:42px;height:68px}.table{min-height:400px}}

.loadingScreen{position:fixed;inset:0;z-index:10000;background:#000;display:flex;align-items:center;justify-content:center;padding:18px;transition:opacity .45s ease,visibility .45s ease}.loadingScreen.hide{opacity:0;visibility:hidden;pointer-events:none}.loadingBox{width:min(92vw,430px);text-align:center}.loadingImage{display:block;width:100%;max-height:62vh;object-fit:contain;border-radius:18px;box-shadow:0 0 28px #00ff2f55}.loadingTitle{margin:16px 0 8px;color:#39ff14;font-weight:1000;letter-spacing:2px;font-size:18px}.loadingBar{height:8px;border:1px solid #39ff14;border-radius:99px;overflow:hidden;background:#061006}.loadingProgress{height:100%;width:0;background:#39ff14;box-shadow:0 0 14px #39ff14;transition:width .18s linear}.loadingStatus{margin-top:8px;color:#b8d8bb;font-size:12px}
</style>
</head>
<body>

<div id="loadingScreen" class="loadingScreen" aria-label="Carregando MAEL66 DOMINÓ">
  <div class="loadingBox">
    <img id="loadingImage" class="loadingImage" src="https://i.imgur.com/ULdKa5x.png" alt="MAEL66 DOMINÓ carregando">
    <div class="loadingTitle">CARREGANDO MAEL66 DOMINÓ...</div>
    <div class="loadingBar"><div id="loadingProgress" class="loadingProgress"></div></div>
    <div id="loadingStatus" class="loadingStatus">Preparando o jogo...</div>
  </div>
</div>

<div id="app" class="app"></div>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast" style="display:none"></div>
<div id="audios" class="audioBox"></div>
<div id="secureBadge" class="secureBadge"></div>

<script>

function initMAEL66Loading(){
 const screen=document.getElementById('loadingScreen');
 const progress=document.getElementById('loadingProgress');
 const status=document.getElementById('loadingStatus');
 const img=document.getElementById('loadingImage');
 if(!screen||!progress)return;
 const steps=['Carregando imagem...','Preparando a mesa...','Conectando o jogo online...','Tudo pronto!'];
 let value=0,step=0,done=false;
 const finish=()=>{if(done)return;done=true;progress.style.width='100%';status.textContent='Tudo pronto!';setTimeout(()=>screen.classList.add('hide'),350)};
 img.addEventListener('error',()=>{status.textContent='Imagem de loading não carregou; continuando o jogo...';setTimeout(finish,700)});
 const timer=setInterval(()=>{value=Math.min(94,value+Math.floor(Math.random()*12)+5);progress.style.width=value+'%';step=Math.min(steps.length-1,Math.floor(value/25));status.textContent=steps[step];if(value>=94){clearInterval(timer);setTimeout(finish,450)}},180);
 setTimeout(()=>{clearInterval(timer);finish()},4500);
}

function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>x.style.display="none",2600)}
function playMessageSound(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    if(!messageAudioCtx)messageAudioCtx=new AC();
    if(messageAudioCtx.state==='suspended')messageAudioCtx.resume().catch(()=>{});
    const now=messageAudioCtx.currentTime;
    const gain=messageAudioCtx.createGain();
    gain.gain.setValueAtTime(0.0001,now);
    gain.gain.exponentialRampToValueAtTime(0.13,now+0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001,now+0.18);
    gain.connect(messageAudioCtx.destination);
    const osc=messageAudioCtx.createOscillator();
    osc.type='sine'; osc.frequency.setValueAtTime(880,now); osc.frequency.exponentialRampToValueAtTime(660,now+0.16);
    osc.connect(gain); osc.start(now); osc.stop(now+0.19);
    const gain2=messageAudioCtx.createGain();
    gain2.gain.setValueAtTime(0.0001,now+0.12);
    gain2.gain.exponentialRampToValueAtTime(0.10,now+0.135);
    gain2.gain.exponentialRampToValueAtTime(0.0001,now+0.30);
    gain2.connect(messageAudioCtx.destination);
    const osc2=messageAudioCtx.createOscillator();
    osc2.type='sine'; osc2.frequency.setValueAtTime(1047,now+0.12); osc2.frequency.exponentialRampToValueAtTime(784,now+0.28);
    osc2.connect(gain2); osc2.start(now+0.12); osc2.stop(now+0.31);
  }catch(e){}
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

function avatarPick(e){
 const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement("canvas");c.width=c.height=160;c.getContext("2d").drawImage(im,0,0,160,160);document.getElementById("prev").src=c.toDataURL("image/jpeg",.78)};im.src=r.result};r.readAsDataURL(f);

 if(!needProfile())return;
 room=code();isHost=true;players=[{...me,peerId:"m66-"+room,seat:0,score:0}];chat=[];
 peer=new Peer("m66-"+room);
 peer.on("open",()=>{renderLobby();toast("Sala criada: "+room)});
 peer.on("connection",c=>setupConn(c));
 peer.on("call",call=>handleCall(call));
 peer.on("error",e=>{if(e.type==="unavailable-id"){toast("Código ocupado. Criando outro...");peer.destroy();createRoom()}else toast("Erro de conexão: "+e.type)});
}
function joinRoom(){
 if(!needProfile())return;
 let c=prompt("Digite o código da sala:");if(!c)return;
 room=c.trim().toUpperCase();isHost=false;
 peer=new Peer();
 peer.on("open",id=>{
   const host="m66-"+room;
   const c=peer.connect(host,{reliable:true,metadata:{profile:me}});
   setupConn(c);
 });
 peer.on("call",call=>handleCall(call));
 peer.on("error",e=>toast("Não foi possível entrar: "+e.type));
}
function setupConn(c){
 conns[c.peer]=c;
 c.on("open",()=>{
   if(!isHost)c.send({type:"join",profile:me,peerId:peer.id});
   else sendSnapshot(c);
 });
 c.on("data",d=>receive(d,c.peer));
 c.on("close",()=>{delete conns[c.peer];if(isHost){players=players.filter(p=>p.peerId!==c.peer);broadcast({type:"lobby",players,chat});renderLobby()}});
 c.on("error",()=>{});
}
function send(c,d){try{if(c&&c.open)c.send(d)}catch(e){}}
function broadcast(d){Object.values(conns).forEach(c=>send(c,d))}
function sendSnapshot(c){send(c,{type:"snapshot",players,game,chat})}
function receive(d,from){
 if(isHost){
  if(d.type==="join"){
   if(players.length>=4){send(conns[from],{type:"full"});return}
   if(players.some(p=>p.peerId===from))return;
   players.push({...d.profile,peerId:from,seat:players.length,score:0});
   chat.push({name:"SISTEMA",text:d.profile.name+" entrou na sala."});
   broadcast({type:"lobby",players,chat});renderLobby();
  } else if(d.type==="chat"){chat.push(d.msg);broadcast({type:"chat",msg:d.msg});playMessageSound();renderChat()}
  else if(d.type==="action" && game){hostAction(d.action)}
  else if(d.type==="startRequest"){startGame()}
 }else{
  if(d.type==="snapshot"){players=d.players||[];game=d.game;chat=d.chat||[];if(game)renderGame();else renderLobby()}
  if(d.type==="lobby"){players=d.players;chat=d.chat||chat;renderLobby()}
  if(d.type==="chat"){chat.push(d.msg);if(d.msg?.senderPeerId!==peer?.id)playMessageSound();renderChat()}
  if(d.type==="state"){game=d.game;renderGame()}
  if(d.type==="full")toast("Sala cheia.");
 }
}
function renderLobby(){
 app.innerHTML=`<div class="logo" style="font-size:43px">mael66<span>games</span></div>
 <div class="panel"><h2>🎲 Sala online</h2><div class="small">CÓDIGO</div><div class="code">${room}</div>
 <button class="btn" onclick="copyCode()">📋 COPIAR CÓDIGO</button><div class="status">${isHost?"👑 Você é o dono da sala":"🟢 Conectado ao dono da sala"} • ${players.length}/4 jogadores</div>
 <div class="players">${players.map(p=>`<div class="pl"><img src="${p.avatar||AVATAR}"><div><b>${esc(p.name)}</b><div class="on">● ONLINE</div></div></div>`).join("")}</div>
 ${isHost?`<label>Quantidade</label><select id="nplayers"><option>2</option><option>3</option><option selected>4</option></select><button class="btn primary" onclick="requestStart()">▶ INICIAR PARTIDA</button>`:`<div class="status">Aguardando o dono iniciar a partida...</div>`}
 <button class="btn red" onclick="leave()">SAIR</button></div>
 <div class="panel"><h3>💬 Chat da sala</h3><div id="chatBox" class="chat"></div><div class="chatbar"><input id="chatIn" placeholder="Escreva uma mensagem"><button class="btn micbtn" onclick="chatSend()">➤</button></div></div>
 <div class="panel"><button class="btn gold" onclick="enableMic()">🎙️ ATIVAR VOZ AO VIVO</button><div class="small">A voz usa WebRTC. Para o microfone funcionar no celular, abra o jogo por HTTPS e permita o microfone quando o Chrome perguntar.</div></div>`;
 renderChat();
}
function copyCode(){navigator.clipboard?.writeText(room);toast("Código "+room+" copiado")}
function requestStart(){if(!isHost){send(conns["m66-"+room],{type:"startRequest"});return}startGame()}
function makeDeck(){let d=[];for(let a=0;a<=6;a++)for(let b=a;b<=6;b++)d.push([a,b]);return d.sort(()=>Math.random()-.5)}
function startGame(){
 if(players.length<2)return toast("São necessários pelo menos 2 jogadores.");
 const n=Math.min(4,players.length),deck=makeDeck(),hands=players.slice(0,n).map(()=>[]);
 for(let r=0;r<7;r++)for(let i=0;i<n;i++)hands[i].push(deck.pop());
 let turn=0,best=-1;hands.forEach((h,i)=>{let v=Math.max(...h.map(t=>t[0]+t[1]));if(v>best){best=v;turn=i}});
 lastResultKey="";
 game={players:players.slice(0,n).map(p=>({...p,score:p.score||0})),hands,deck,board:[],left:null,right:null,turn,passes:0,finished:false,round:1,resultMessage:""};
 broadcast({type:"state",game});renderGame();
}
function tile(t){return `<div class="domino"><div class="half">${pips(t[0])}</div><div class="half">${pips(t[1])}</div></div>`}
function pips(n){let pos={0:[],1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}[n];return `<div class="pips">${Array.from({length:9},(_,i)=>`<i class="pip" style="visibility:${pos.includes(i)?"visible":"hidden"}"></i>`).join("")}</div>`}
function renderGame(){
 const ix=game.players.findIndex(p=>p.peerId===peer.id||p.id===me.id);
 app.innerHTML=`<div class="topbar"></div><div class="panel" style="padding:8px"><div style="display:flex;justify-content:space-between"><b style="color:var(--g)">MAEL66 DOMINÓ ONLINE</b><button class="btn" style="width:auto;margin:0;padding:7px" onclick="showScores()">🏆</button></div></div>
 <div class="table"><div class="seats">${game.players.map((p,i)=>`<div class="seat ${game.turn===i?"active":""}"><img src="${p.avatar||AVATAR}"><div>${esc(p.name)}</div><div>🏆 ${p.score}</div></div>`).join("")}</div>
 <div style="text-align:center;font-weight:bold">${game.finished?"🏁 RODADA FINALIZADA":"VEZ DE: "+esc(game.players[game.turn].name)}</div>
 ${game.finished&&game.resultMessage?`<div class="winnerBanner"><div class="big">🏆 ${esc(game.resultMessage.name)} VENCEU!</div><div class="pts">${esc(game.resultMessage.detail)}</div></div>`:""}
 <div class="ends">${game.board.length?"EXTREMIDADES "+game.left+" ◀   ▶ "+game.right:"JOGUE A PRIMEIRA PEDRA"}</div>
 <div class="dropzones"><div class="dropzone leftZone" data-side="left">⬅️ SOLTE AQUI<br><small>LADO ESQUERDO</small></div><div class="dropzone center" data-side="center">${game.board.length?"↔️ MESA":"🎲 SOLTE A PRIMEIRA PEDRA"}</div><div class="dropzone rightZone" data-side="right">SOLTE AQUI ➡️<br><small>LADO DIREITO</small></div></div><div class="board">${game.board.length?game.board.map(tile).join(""):"<span class='small'>A mesa está vazia</span>"}</div>
 <div style="text-align:center;color:#b9d8bc;font-size:12px">Monte: ${game.deck.length} • Suas pedras: ${ix>=0?game.hands[ix].length:0}</div></div>
 <div class="handwrap"><div class="small" style="text-align:center;color:var(--g);font-weight:800;margin-bottom:4px">👆 Arraste sua pedra até o lado esquerdo ou direito da mesa • Toque na pedra também funciona</div><div class="hand">${ix>=0?game.hands[ix].map((t,i)=>`<div class="dragTile" data-index="${i}" onclick="act({type:'play',index:${i}})">${tile(t)}</div>`).join(""):""}</div></div>
 <div class="actions"><button class="btn gold" onclick="act({type:'draw'})">➕ COMPRAR</button><button class="btn" onclick="act({type:'pass'})">⏭️ PASSAR</button></div>
 <div class="panel"><div style="display:flex;justify-content:space-between"><h3>💬 Chat</h3><button class="btn gold" style="width:auto;margin:0;padding:7px" onclick="enableMic()">🎙️ VOZ</button></div><div class="small">Status: ${localStream?"🟢 microfone ativo":"⚪ microfone desligado"}</div><div id="chatBox" class="chat"></div><div class="chatbar"><input id="chatIn" placeholder="Mensagem"><button class="btn micbtn" onclick="chatSend()">➤</button></div></div>
 ${game.finished?`<button class="btn primary" onclick="newRound()">🔄 NOVA RODADA</button>`:""}
 <button class="btn red" onclick="leave()">SAIR DA SALA</button>`;
 renderChat();
 setupDominoDrag();
 if(game.finished&&game.resultMessage){const key=(game.resultMessage.name||"")+"|"+(game.resultMessage.detail||"");if(key!==lastResultKey){lastResultKey=key;toast("🏆 "+game.resultMessage.name+" venceu! "+game.resultMessage.detail);}}
}
function act(a){
 if(isHost)hostAction(a);else{let host=players[0]?.peerId;if(host)send(conns[host],{type:"action",action:a})}
}
function hostAction(a){
 if(!game||game.finished)return;
 let ix=game.players.findIndex(p=>p.peerId===peer.id);
 // Host's own actions arrive here directly; guest actions carry no sender in this simple protocol,
 // so infer guest from the optional sender below when present.
 let sender=a.senderPeerId||peer.id;
 ix=game.players.findIndex(p=>p.peerId===sender);
 if(ix<0)return;
 if(game.turn!==ix)return;
 if(a.type==="draw"){if(game.deck.length)game.hands[ix].push(game.deck.pop());else return toast("Monte vazio.")}
 if(a.type==="pass"){
   if(game.hands[ix].some(canPlay))return sendTo(ix,{type:"notice",text:"Você tem uma pedra que pode jogar."});
   game.passes++; if(game.passes>=game.players.length)return closeRound();
   game.turn=(game.turn+1)%game.players.length;
 }
 if(a.type==="play"){
   let t=game.hands[ix][a.index];if(!t||!canPlay(t))return sendTo(ix,{type:"notice",text:"Essa pedra não encaixa."});
   let side=a.side||((game.board.length&&t.includes(game.left))?"left":"right");
   game.hands[ix].splice(a.index,1);
   if(!game.board.length){game.board=[t];game.left=t[0];game.right=t[1]}
   else if(side==="left"){
     if(!t.includes(game.left)){game.hands[ix].splice(a.index,0,t);return sendTo(ix,{type:"notice",text:"Essa pedra não encaixa no lado esquerdo."})}
     let o=t[1]===game.left?[t[0],t[1]]:[t[1],t[0]];game.board.unshift(o);game.left=o[0]
   } else {
     if(!t.includes(game.right)){game.hands[ix].splice(a.index,0,t);return sendTo(ix,{type:"notice",text:"Essa pedra não encaixa no lado direito."})}
     let o=t[0]===game.right?[t[0],t[1]]:[t[1],t[0]];game.board.push(o);game.right=o[1]
   }
   game.passes=0;
   if(!game.hands[ix].length){finish(ix);return}
   game.turn=(game.turn+1)%game.players.length;
 }
 broadcast({type:"state",game});renderGame();
}
function canPlay(t){return !game.board.length||t.includes(game.left)||t.includes(game.right)}
function finish(w){let pts=game.hands.reduce((s,h,i)=>s+(i===w?0:h.reduce((a,t)=>a+t[0]+t[1],0)),0);game.players[w].score+=pts;game.resultMessage={name:game.players[w].name,detail:"Ganhou a rodada e recebeu +"+pts+" pontos."};game.finished=true;broadcast({type:"state",game});renderGame();}
function closeRound(){let sums=game.hands.map(h=>h.reduce((s,t)=>s+t[0]+t[1],0));let w=sums.indexOf(Math.min(...sums));let pts=sums.reduce((a,b)=>a+b,0)-sums[w];game.players[w].score+=pts;game.resultMessage={name:game.players[w].name,detail:"Venceu pelo menor número de pontos restantes e recebeu +"+pts+" pontos."};game.finished=true;broadcast({type:"state",game});renderGame();}
function newRound(){if(!isHost){send(conns[players[0].peerId],{type:"newRound"});return}startGame()}
function sendTo(ix,d){let p=game.players[ix];if(p.peerId===peer.id){if(d.type==="notice")toast(d.text)}else send(conns[p.peerId],d)}
function renderChat(){let e=document.getElementById("chatBox");if(!e)return;e.innerHTML=chat.map(m=>`<div class="msg ${m.name===me?.name?"me":""}"><b>${esc(m.name)}</b><br>${esc(m.text)}</div>`).join("");e.scrollTop=e.scrollHeight}
function chatSend(){let i=document.getElementById("chatIn");if(!i||!i.value.trim())return;let m={name:me.name,text:i.value.trim(),senderPeerId:peer?.id||me.id};i.value="";if(isHost){chat.push(m);broadcast({type:"chat",msg:m});renderChat()}else{let host=players[0]?.peerId;send(conns[host],{type:"chat",msg:m})}}
function setupDominoDrag(){
  document.querySelectorAll(".dragTile").forEach(w=>{
    const tileEl=w.querySelector(".domino"); if(!tileEl) return;
    let startX=0,startY=0,moved=false,ghost=null,index=-1;
    w.addEventListener("pointerdown",e=>{
      index=Number(w.dataset.index); startX=e.clientX; startY=e.clientY; moved=false;
      if(e.pointerType==="mouse" && e.button!==0)return;
      try{w.setPointerCapture(e.pointerId)}catch(_){ }
    });
    w.addEventListener("pointermove",e=>{
      if(index<0)return; const dx=e.clientX-startX,dy=e.clientY-startY;
      if(!moved && Math.hypot(dx,dy)>8){
        moved=true; w.classList.add("dragging");
        ghost=tileEl.cloneNode(true); ghost.className="domino dragghost"; document.body.appendChild(ghost);
      }
      if(moved){
        e.preventDefault(); ghost.style.left=e.clientX+"px"; ghost.style.top=e.clientY+"px";
        document.querySelectorAll(".dropzone").forEach(z=>{const r=z.getBoundingClientRect(); const on=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom; z.classList.toggle("active",on)});
      }
    },{passive:false});
    w.addEventListener("pointerup",e=>{
      if(index<0)return;
      if(moved){
        let side=null;
        document.querySelectorAll(".dropzone").forEach(z=>{const r=z.getBoundingClientRect(); if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)side=z.dataset.side});
        if(side){ if(side==="center"&&game&&game.board.length) side=(e.clientX<document.querySelector(".board").getBoundingClientRect().left+document.querySelector(".board").getBoundingClientRect().width/2)?"left":"right"; act({type:"play",index,side}); }
        else toast("Arraste a pedra até o lado esquerdo ou direito da mesa.");
      }
      cleanup();
    });
    w.addEventListener("pointercancel",cleanup);
    function cleanup(){index=-1;moved=false;w.classList.remove("dragging");if(ghost){ghost.remove();ghost=null}document.querySelectorAll(".dropzone").forEach(z=>z.classList.remove("active"));}
  });
}
function setupDominoDrag(){
 document.querySelectorAll(".dragTile").forEach(w=>{
   const tileEl=w.querySelector(".domino"); if(!tileEl)return;
   let sx=0,sy=0,moved=false,idx=-1,ghost=null;
   const clear=()=>{idx=-1;moved=false;w.classList.remove("dragging");if(ghost){ghost.remove();ghost=null}document.querySelectorAll(".dropzone").forEach(z=>z.classList.remove("active"));};
   w.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"&&e.button!==0)return;idx=Number(w.dataset.index);sx=e.clientX;sy=e.clientY;try{w.setPointerCapture(e.pointerId)}catch(_){}},{passive:true});
   w.addEventListener("pointermove",e=>{
     if(idx<0)return; const d=Math.hypot(e.clientX-sx,e.clientY-sy);
     if(!moved&&d>8){moved=true;w.classList.add("dragging");ghost=tileEl.cloneNode(true);ghost.className="domino dragghost";document.body.appendChild(ghost);}
     if(!moved)return;e.preventDefault();ghost.style.left=e.clientX+"px";ghost.style.top=e.clientY+"px";
     document.querySelectorAll(".dropzone").forEach(z=>{const r=z.getBoundingClientRect();z.classList.toggle("active",e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom);});
   },{passive:false});
   w.addEventListener("pointerup",e=>{
     if(idx<0)return;
     if(moved){let side=null;document.querySelectorAll(".dropzone").forEach(z=>{const r=z.getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)side=z.dataset.side;});
       if(side==="center"&&game?.board?.length){const b=document.querySelector(".board")?.getBoundingClientRect();side=b&&e.clientX<b.left+b.width/2?"left":"right";}
       if(side)act({type:"play",index:idx,side});else toast("Arraste a pedra até a mesa.");
     }
     clear();
   });
   w.addEventListener("pointercancel",clear);
 });
}
function secureContextStatus(){
 const secure=window.isSecureContext===true || location.hostname==='localhost' || location.hostname==='127.0.0.1';
 const badge=document.getElementById('secureBadge');
 if(badge){badge.className='secureBadge '+(secure?'ok':'bad');badge.textContent=secure?'🔒 HTTPS/SEGURO':'⚠️ PRECISA HTTPS';}
 return secure;
}
async function enableMic(){
 if(localStream)return toast("🎙️ Microfone já está ativo.");
 if(!navigator.mediaDevices?.getUserMedia){
   return toast("O navegador não liberou o microfone. Abra o jogo por HTTPS.");
 }
 if(!secureContextStatus()) {
   modal(`<h2>🎙️ Microfone bloqueado</h2><p>Esta página não está em um contexto seguro.</p><p>Publique o arquivo como <b>HTTPS</b> (GitHub Pages, por exemplo) e abra o endereço <b>https://...</b> no Chrome.</p><button class="btn" onclick="closeModal()">ENTENDI</button>`);
   return;
 }
 try{
   const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
   localStream=stream;
   toast("🎙️ Microfone ativo");
   players.forEach(p=>{if(p.peerId!==peer.id)callPeer(p.peerId)});
   renderGame();
 }catch(err){
   const msg=err?.name==='NotAllowedError' ? "Permissão do microfone negada. Toque no cadeado do endereço do site e permita o Microfone." : "Não foi possível acessar o microfone. Verifique a permissão do navegador.";
   toast(msg);
 }
}
function callPeer(id){
 if(!localStream||!peer)return;
 if(calls[id])return;
 let call=peer.call(id,localStream);calls[id]=call;call.on("close",()=>delete calls[id]);
}
function handleCall(call){
 if(!localStream){call.answer();}else call.answer(localStream);
 call.on("stream",stream=>addAudio(call.peer,stream));
 calls[call.peer]=call;
}
function addAudio(id,stream){
 let old=document.getElementById("audio-"+id);if(old)old.remove();
 let a=document.createElement("audio");a.id="audio-"+id;a.autoplay=true;a.playsInline=true;a.srcObject=stream;document.getElementById("audios").appendChild(a);
}
function showScores(){if(!game)return;modal(`<h2>🏆 Pontuação</h2>${game.players.slice().sort((a,b)=>b.score-a.score).map(p=>`<div class="pl" style="margin:6px 0"><img src="${p.avatar||AVATAR}"><div><b>${esc(p.name)}</b><div>${p.score} pontos</div></div></div>`).join("")}<button class="btn" onclick="closeModal()">FECHAR</button>`)}
function rules(){modal(`<h2>📖 MAEL66 DOMINÓ V3</h2><p>Crie uma sala e compartilhe o código com até 3 amigos. O dono inicia com 2 a 4 jogadores.</p><p>As peças são distribuídas automaticamente. Jogue uma pedra que encaixe em uma das extremidades, compre quando não tiver jogada e passe quando o monte estiver vazio/sem jogada.</p><p>O chat funciona pela conexão da sala. A voz usa WebRTC diretamente entre os navegadores. Para o microfone, publique esta página em HTTPS.</p><p><b>Microfone:</b> por segurança dos navegadores, normalmente precisa de uma página HTTPS.</p><button class="btn" onclick="closeModal()">FECHAR</button>`)}
function modal(x){document.getElementById("modal").innerHTML=`<div class="modalbox">${x}</div>`;document.getElementById("modal").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
function leave(){try{Object.values(conns).forEach(c=>c.close());if(peer)peer.destroy();if(localStream)localStream.getTracks().forEach(t=>t.stop())}catch(e){}peer=null;conns={};calls={};localStream=null;room=null;game=null;players=[];chat=[];renderHome()}

// Host receives guest actions with sender identity through wrapper:
const oldReceive=receive;
receive=function(d,from){
 if(isHost && d.type==="action"){d.action.senderPeerId=from;hostAction(d.action);return}
 if(isHost && d.type==="newRound"){startGame();return}
 oldReceive(d,from);
};

secureContextStatus();
initMAEL66Loading();
start();
</script>
