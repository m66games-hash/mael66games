*{

html,

/* ================= LOADING ================= */

#loadingScreen{
    position:fixed;
    inset:0;

    background:
    linear-gradient(
        180deg,
        #000 0%,
        #1a4d2e 50%,
        #000 100%
    );

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;
    z-index:100;

    transition:opacity .5s ease;
}

.loadingImage{
    position:absolute;

    top:4%;
    left:50%;

    transform:translateX(-50%);

    width:88%;
    max-width:400px;

    border-radius:20px;

    box-shadow:
        0 0 40px #ffd70066,
        0 0 70px #20ff0044;

    border:3px solid #ffd700;

    animation:pulse 2s infinite ease-in-out;

    object-fit:contain;
}

@keyframes pulse{

    0%,100%{
        transform:
        translateX(-50%)
        scale(1);
    }

    50%{
        transform:
        translateX(-50%)
        scale(1.03);
    }

}

.darkOverlay{
    position:absolute;
    inset:0;

    background:
    linear-gradient(
        to bottom,
        rgba(0,0,0,.1) 0%,
        rgba(0,0,0,.2) 40%,
        rgba(0,0,0,.85) 100%
    );

    z-index:1;
}

.loadingBox{
    position:absolute;
    z-index:5;

    left:5%;
    right:5%;
    bottom:4%;

    padding:20px 16px;

    background:#000;

    border:3px solid #20ff00;

    border-radius:22px;

    box-shadow:
        0 0 8px #20ff00,
        0 0 20px #20ff00,
        inset 0 0 15px rgba(32,255,0,.25);
}

.gameTitle{
    text-align:center;

    color:#fff;

    font-size:
    clamp(22px,7vw,34px);

    font-weight:900;

    letter-spacing:2px;

    margin-bottom:8px;

    text-shadow:
        0 0 10px #20ff00;
}

.status{
    text-align:center;

    color:#20ff00;

    font-size:14px;

    font-weight:bold;

    margin-bottom:10px;
}

.progressBar{
    width:100%;
    height:18px;

    background:#111;

    border:2px solid #20ff00;

    border-radius:20px;

    padding:2px;

    box-shadow:
        0 0 10px #20ff00;
}

.progress{
    width:0%;
    height:100%;

    border-radius:15px;

    background:
    linear-gradient(
        90deg,
        #20ff00,
        #ffd700
    );

    box-shadow:
        0 0 12px #20ff00;

    transition:
        width .1s linear;
}

.percent{
    text-align:center;

    color:#20ff00;

    font-size:18px;

    font-weight:900;

    margin-top:7px;
}

.steps{

    font-size:12px;

    line-height:1.8;
}

.step{
    opacity:.35;
}

.step.active{
    opacity:1;

    color:#20ff00;

    font-weight:bold;

    text-shadow:
        0 0 8px #20ff00;
}


/* ================= LOGIN ================= */

.auth-screen{

.auth-subtitle{

/* ================= JOGO ================= */

/* ================= SLOT ================= */

.slot-container{

    border-radius:20px;

    padding:11px;

/* APOSTA */

.slot-container > .bet{

    text-align:center;

    margin-bottom:7px !important;

    font-size:1rem;
}


/* ================= GRID ================= */

.slot-grid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:7px;

    margin:7px 0 9px;
}

.slot-cell{

    aspect-ratio:1;

    background:#000;

    border:3px solid #20ff00;

    border-radius:12px;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    transition:.1s;
}

.slot-cell.spinning{

    animation:
        shake .1s infinite;
}

@keyframes shake{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5px);
    }

}

.slot-icon{

    width:80%;
    height:80%;

    object-fit:contain;

    display:block;
}


/* ================= CONTROLES ================= */

.controls{

    margin-top:5px;

    display:flex;

    flex-direction:row;

    align-items:center;

    justify-content:center;

    gap:8px;

.btn-spin:active{

        0 1px 0 #006622;
}

.btn-spin:disabled{

    cursor:not-allowed;
}


/* BOTÕES + E - */

.bet-controls{

}

.bet-btn{

}

</style>

<script>

/* =====================================================
   SISTEMA DE SOM
===================================================== */

let audioCtx = null;


function iniciarAudio(){

    try{

        if(!audioCtx){

            audioCtx =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if(
            audioCtx.state ===
            "suspended"
        ){

            audioCtx.resume();

        }

    }catch(e){

        console.log(
            "Áudio não disponível:",
            e
        );

    }

}


function som(
    frequencia,
    duracao,
    tipo="sine",
    volume=.08
){

    iniciarAudio();

    if(!audioCtx)
        return;


    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();


    osc.type =
        tipo;

    osc.frequency.value =
        frequencia;


    gain.gain.setValueAtTime(
        volume,
        audioCtx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime +
        duracao
    );


    osc.connect(gain);

    gain.connect(
        audioCtx.destination
    );


    osc.start();


    osc.stop(
        audioCtx.currentTime +
        duracao
    );

}


/* SOM BOTÃO */

function somBotao(){

    som(
        520,
        .08,
        "square",
        .05
    );

}


/* SOM GIRO */

function somGiro(){

    som(
        180 +
        Math.random()*100,

        .07,

        "square",

        .035
    );

}


/* SOM VITÓRIA */

function somVitoria(){

    iniciarAudio();

    if(!audioCtx)
        return;


    const notas = [

        523,
        659,
        784,
        1046

    ];


    notas.forEach(
        (nota,i)=>{

            setTimeout(
                ()=>{

                    som(
                        nota,
                        .25,
                        "sine",
                        .10
                    );

                },

                i*120
            );

        }
    );

}


/* SOM DERROTA */

function somDerrota(){

    som(
        180,
        .25,
        "sawtooth",
        .07
    );


    setTimeout(
        ()=>{

            som(
                120,
                .35,
                "sawtooth",
                .05
            );

        },
        180
    );

}

    else{

            setTimeout(
            ()=>{

                document

);


/* =====================================================
   SISTEMA DO JOGO
===================================================== */

let user = null;

let coins = 500;

let bet = 10;

let isSpinning = false;

let grid =
    Array(9).fill(null);


let accounts =
    JSON.parse(
        localStorage.getItem(
            'mael66_accounts'
        ) || '{}'
    );


/* =====================================================
   LOGIN
===================================================== */

function checkLogin(){

    const savedUser =
        localStorage.getItem(
            'mael66_current_user'
        );


    if(
        savedUser &&
        accounts[savedUser]
    ){

        user =
            savedUser;


        coins =
            accounts[user].coins ||
            500;


        showGame();

    }

    else{

        showLogin();

    }

}


function showLogin(){

    hideAll();


    document
    .getElementById(
        'login-screen'
    )
    .style.display='flex';


    clearErrors();

}


function showRegister(){

    somBotao();

    hideAll();


    document
    .getElementById(
        'register-screen'
    )
    .style.display='flex';


    clearErrors();

}


function showGame(){

    hideAll();


    document
    .getElementById(
        'game-screen'
    )
    .style.display='block';


    document
    .getElementById(
        'username-display'
    )
    .textContent =
        user;


    updateUI();

    renderGrid();

}


function hideAll(){

    document
    .getElementById(
        'login-screen'
    )
    .style.display='none';


    document
    .getElementById(
        'register-screen'
    )
    .style.display='none';


    document
    .getElementById(
        'game-screen'
    )
    .style.display='none';

}


function clearErrors(){

    document
    .getElementById(
        'login-error'
    )
    .textContent='';


    document
    .getElementById(
        'reg-error'
    )
    .textContent='';

}


function showError(
    elementId,
    message
){

    document
    .getElementById(
        elementId
    )
    .textContent =
        message;

}


/* =====================================================
   CADASTRO
===================================================== */

function register(){

    somBotao();


    const userVal =
        document
        .getElementById(
            'reg-user'
        )
        .value.trim();


    const emailVal =
        document
        .getElementById(
            'reg-email'
        )
        .value.trim();


    const passVal =
        document
        .getElementById(
            'reg-pass'
        )
        .value;


    const pass2Val =
        document
        .getElementById(
            'reg-pass2'
        )
        .value;


    if(!userVal)

        return showError(
            'reg-error',
            'Digite seu nome de usuário!'
        );


    if(!emailVal)

        return showError(
            'reg-error',
            'Digite seu e-mail!'
        );


    if(!passVal)

        return showError(
            'reg-error',
            'Crie uma senha!'
        );


    if(passVal.length < 4)

        return showError(
            'reg-error',
            'Mínimo 4 caracteres!'
        );


    if(passVal !== pass2Val)

        return showError(
            'reg-error',
            'Senhas não coincidem!'
        );


    if(accounts[userVal])

        return showError(
            'reg-error',
            'Usuário já existe!'
        );


    accounts[userVal] = {

        email:emailVal,

        password:passVal,

        coins:500

    };


    saveAccounts();


    somVitoria();


    alert(
        '✅ Conta criada! Faça login.'
    );


    showLogin();


    document
    .getElementById(
        'reg-user'
    )
    .value='';


    document
    .getElementById(
        'reg-email'
    )
    .value='';


    document
    .getElementById(
        'reg-pass'
    )
    .value='';


    document
    .getElementById(
        'reg-pass2'
    )
    .value='';

}


/* =====================================================
   LOGIN
===================================================== */

function login(){

    somBotao();


    const userVal =
        document
        .getElementById(
            'login-user'
        )
        .value.trim();


    const passVal =
        document
        .getElementById(
            'login-pass'
        )
        .value;


    if(!userVal)

        return showError(
            'login-error',
            'Digite o usuário!'
        );


    if(!passVal)

        return showError(
            'login-error',
            'Digite a senha!'
        );


    if(!accounts[userVal])

        return showError(
            'login-error',
            'Usuário não encontrado!'
        );


    if(
        accounts[userVal].password
        !== passVal
    )

        return showError(
            'login-error',
            'Senha incorreta!'
        );


    user =
        userVal;


    coins =
        accounts[user].coins ||
        500;


    localStorage.setItem(
        'mael66_current_user',
        user
    );


    document
    .getElementById(
        'login-user'
    )
    .value='';


    document
    .getElementById(
        'login-pass'
    )
    .value='';


    somVitoria();


    showGame();

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

    somBotao();


    if(
        user &&
        accounts[user]
    ){

        accounts[user].coins =
            coins;


        saveAccounts();

    }


    localStorage.removeItem(
        'mael66_current_user'
    );


    user=null;

    coins=500;

    bet=10;


    showLogin();

}


/* =====================================================
   SALVAR
===================================================== */

function saveAccounts(){

    localStorage.setItem(
        'mael66_accounts',
        JSON.stringify(accounts)
    );

}


/* =====================================================
   ATUALIZAR
===================================================== */

function updateUI(){

    document
    .getElementById(
        'coins'
    )
    .textContent =
        coins;


    document
    .getElementById(
        'bet-value'
    )
    .textContent =
        bet;

}


/* =====================================================
   APOSTA
===================================================== */

function changeBet(amount){

    if(isSpinning)
        return;


    somBotao();


    const newBet =
        bet + amount;


    if(
        newBet >= 5 &&
        newBet <= coins
    ){

        bet =
            newBet;


        updateUI();

    }

}


/* =====================================================
   RENDERIZAR GRID
===================================================== */

function renderGrid(){

    const container =
        document
        .getElementById(
            'slot-grid'
        );


    container.innerHTML='';


    for(
        let i=0;
        i<9;
        i++
    ){

        const cell =
            document.createElement(
                'div'
            );


        cell.className =
            'slot-cell';


        cell.id =
            `cell-${i}`;


        if(grid[i]){

            if(grid[i].img){

                cell.innerHTML =

                    `<img
                        src="${grid[i].img}"
                        class="slot-icon"
                        alt="${grid[i].name}"
                        onerror="this.parentElement.innerHTML='🐶'"
                    >`;

            }

            else{

                cell.innerHTML =

                    `<span
                        style="font-size:2.5rem">

                        ${grid[i].emoji}

                    </span>`;

            }

        }


        container.appendChild(
            cell
        );

    }

}


/* =====================================================
   GIRO
===================================================== */

function spin(){

    iniciarAudio();


    if(isSpinning)
        return;


    if(coins < bet){

        somDerrota();


        return alert(
            '❌ Moedas insuficientes!'
        );

    }


    isSpinning=true;


    coins -= bet;


    updateUI();


    document
    .getElementById(
        'win-text'
    )
    .textContent='';


    document
    .getElementById(
        'spin-btn'
    )
    .disabled=true;


    let spinCount=0;

    const maxSpins=22;


    const spinInterval =
    setInterval(
    ()=>{

        somGiro();


        for(
            let i=0;
            i<9;
            i++
        ){

            grid[i] =
                symbols[
                    Math.floor(
                        Math.random()
                        * symbols.length
                    )
                ];


            const cell =
                document
                .getElementById(
                    `cell-${i}`
                );


            cell.classList.add(
                'spinning'
            );


            if(grid[i].img){

                cell.innerHTML =

                    `<img
                        src="${grid[i].img}"
                        class="slot-icon"
                        alt="${grid[i].name}"
                        onerror="this.parentElement.innerHTML='🐶'"
                    >`;

            }

            else{

                cell.innerHTML =

                    `<span
                        style="font-size:2.5rem">

                        ${grid[i].emoji}

                    </span>`;

            }

        }


        spinCount++;


        if(
            spinCount >= maxSpins
        ){

            clearInterval(
                spinInterval
            );


            for(
                let i=0;
                i<9;
                i++
            ){

                grid[i] =
                    symbols[
                        Math.floor(
                            Math.random()
                            * symbols.length
                        )
                    ];


                const cell =
                    document
                    .getElementById(
                        `cell-${i}`
                    );


                cell.classList.remove(
                    'spinning'
                );


                if(grid[i].img){

                    cell.innerHTML =

                        `<img
                            src="${grid[i].img}"
                            class="slot-icon"
                            alt="${grid[i].name}"
                            onerror="this.parentElement.innerHTML='🐶'"
                        >`;

                }

                else{

                    cell.innerHTML =

                        `<span
                            style="font-size:2.5rem">

                            ${grid[i].emoji}

                        </span>`;

                }

            }


            checkWin();


            isSpinning=false;


            document
            .getElementById(
                'spin-btn'
            )
            .disabled=false;

        }

    },
    90
    );

}


/* =====================================================
   VERIFICAR PRÊMIO
===================================================== */

function checkWin(){

    let winAmount=0;


    const lines=[

        [0,1,2],

        [3,4,5],

        [6,7,8],

        [0,3,6],

        [1,4,7],

        [2,5,8],

        [0,4,8],

        [2,4,6]

    ];


    lines.forEach(
        line=>{

            const a =
                grid[line[0]];

            const b =
                grid[line[1]];

            const c =
                grid[line[2]];


            if(
                a.id === b.id &&
                b.id === c.id
            ){

                if(
                    a.id === 'dog'
                )

                    winAmount +=
                        bet * 5;


                else if(
                    a.id === 'coin'
                )

                    winAmount +=
                        bet * 3;


                else if(
                    a.id === 'wild'
                )

                    winAmount +=
                        bet * 10;


                else if(
                    a.id === 'bonus'
                )

                    winAmount +=
                        bet * 15;

            }


            else if(

                a.id === b.id ||

                b.id === c.id ||

                a.id === c.id

            ){

                winAmount +=
                    Math.floor(
                        bet * .5
                    );

            }

        }
    );


    if(winAmount > 0){

        coins +=
            winAmount;


        document
        .getElementById(
            'win-text'
        )
        .textContent =
            `🎉 VENCEU! +${winAmount} moedas!`;


        somVitoria();

    }

    else{

        document
        .getElementById(
            'win-text'
        )
        .textContent =
            'Tente novamente! 🍀';


        somDerrota();

    }


    updateUI();


    if(
        user &&
        accounts[user]
    ){

        accounts[user].coins =
            coins;


        saveAccounts();

    }

}

</script>
